[project]
name = "tmux-voice"
version = "0.1.0"
requires-python = ">=3.13"
description = "Push-to-talk dictation for Claude Code and Codex in tmux on macOS"
readme = "README.md"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tmux-voice = "tmux_voice.__main__:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
