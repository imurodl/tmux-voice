# Minimal tmux setup for running Claude Code / Codex side by side.

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Let the terminal handle links and pass extended keys through
set -g allow-passthrough on
set -s extended-keys on

# Splits keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Option+arrow switches panes, Shift+arrow switches windows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window

# Highlight a window when an agent rings the bell (e.g. a Claude Code Stop hook running `printf '\a'`)
setw -g monitor-bell on
set -g visual-bell off

setw -g mode-keys vi
set -g allow-rename off
bind r source-file ~/.tmux.conf \; display "Config reloaded"
